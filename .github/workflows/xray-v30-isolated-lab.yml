name: Xray v30 isolated API TCP continuity lab

on:
  push:
    branches:
      - snapshot/keenetic-production-2026-10-30
    paths:
      - 'xray/lab/xray_v30_api_continuity.py'
      - '.github/workflows/xray-v30-isolated-lab.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  xray-api-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Download pinned Xray 26.2.6 binary (CI runner only)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/xray"
          curl -fL --retry 3 --connect-timeout 15 --max-time 120 \
            -o "$RUNNER_TEMP/xray/xray.zip" \
            https://github.com/XTLS/Xray-core/releases/download/v26.2.6/Xray-linux-64.zip
          unzip -j "$RUNNER_TEMP/xray/xray.zip" xray -d "$RUNNER_TEMP/xray"
          chmod 700 "$RUNNER_TEMP/xray/xray"
          "$RUNNER_TEMP/xray/xray" version
      - name: Run isolated loopback API balancer and old TCP continuity
        shell: bash
        run: |
          python xray/lab/xray_v30_api_continuity.py \
            --xray "$RUNNER_TEMP/xray/xray" --run
