name: RC2 Hysteria2 isolated lab
on:
  push:
    branches: [feature/rc2-hysteria2-monitor-candidate-20261127]
    paths:
      - 'monitoring/lab/mixed_rc2/**'
      - '.github/workflows/rc2-hysteria2-lab.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -m pip install Jinja2==3.1.6 PyYAML==6.0.2
      - run: python3 -B -m unittest discover -s monitoring/lab/mixed_rc2 -p 'test_*.py' -v
      - run: python3 -B -m unittest discover -s monitoring/tests -p 'test_*.py' -v
  mqtt:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends mosquitto mosquitto-clients python3-jinja2
      - name: Real isolated broker and subscription cycle
        run: |
          sudo unshare --net -- bash -c 'set -e; ip link set lo up; export PYTHONPATH="$1"; exec python3 -B "$1/monitoring/lab/mixed_rc2/mqtt_broker_lab.py"' lab "$GITHUB_WORKSPACE"
  loopback:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            asset: Xray-linux-64.zip
            sha256: 29ce535b56e207a406ffa1c2d4842dcc410be003eff8ec508bb732abc9f8e385
          - arch: mips32le
            asset: Xray-linux-mips32le.zip
            sha256: 1590b2bcefe64fb0604f29c8c75219bfbe8f63daa3bc8e3956edfa6da97c5869
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fetch and verify public release binaries
        env:
          ASSET: ${{ matrix.asset }}
          DIGEST: ${{ matrix.sha256 }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rc2-bin"
          cd "$RUNNER_TEMP/rc2-bin"
          curl --fail --location --silent --show-error --max-time 120 -o xray.zip "https://github.com/XTLS/Xray-core/releases/download/v26.2.6/$ASSET"
          printf '%s  xray.zip\n' "$DIGEST" | sha256sum -c -
          unzip -q xray.zip xray
          curl --fail --location --silent --show-error --max-time 120 -o hysteria https://github.com/HyNetworks/hysteria/releases/download/app/v2.7.0/hysteria-linux-amd64
          printf '%s  hysteria\n' 2b0c8b49e4158822752f206fe714753797e0771163114cf39387f1a7d265e288 | sha256sum -c -
          chmod 755 xray hysteria
      - name: Install disposable emulator
        if: matrix.arch == 'mips32le'
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends qemu-user
      - name: Run synthetic local QUIC interoperability test in isolated namespace
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          args=()
          if [ "$ARCH" = mips32le ]; then args+=(--qemu /usr/bin/qemu-mipsel); fi
          sudo unshare --net -- bash -c 'set -e; ip link set lo up; export PYTHONPATH="$1"; shift; exec python3 -B "$@"' lab "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/monitoring/lab/mixed_rc2/loopback_lab.py" --xray "$RUNNER_TEMP/rc2-bin/xray" --hysteria "$RUNNER_TEMP/rc2-bin/hysteria" "${args[@]}"
