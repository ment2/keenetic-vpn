name: Xray v30 RC14 dual provenance full isolated regressions (NO DEPLOY)

on:
  push:
    branches:
      - feature/xray-v30-stable-tcp-ingress-lab-20261031
    paths:
      - '.github/workflows/xray-v30-rc14-regression.yml'
      - 'xray/staging/v30-rc14-pidfd-source-provenance.json'
      - 'xray/lab/archive/rc10_native_tproxy_minimal_caps_historical.sh'
      - 'tests/test_xray_v30_rc10_linux49_release.py'
      - 'tests/test_xray_v30_rc14_source_provenance.py'
      - 'tests/test_xray_v30_rc11_pidfd.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rc14-offline-provenance-and-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify all offline contracts and immutable RC10 history
        run: python -m unittest discover -s tests -p 'test_*.py' -v

  rc10-native-netns:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: RC11 fail-closed PID identity regression suite
        run: |
          python3 -m unittest discover -s tests -p test_xray_v30_rc11_pidfd.py -v
          bash -n xray/lab/rc10_native_tproxy_minimal_caps.sh
      - name: Install disposable kernel network namespace and capabilities utilities
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            iproute2 iptables unzip curl util-linux
      - name: Download exact official 26.2.6 Xray amd64 test binary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rc10-native"
          curl -fL --retry 3 --max-time 120 -o "$RUNNER_TEMP/rc10-native/xray.zip" \
            https://github.com/XTLS/Xray-core/releases/download/v26.2.6/Xray-linux-64.zip
          unzip -j "$RUNNER_TEMP/rc10-native/xray.zip" xray -d "$RUNNER_TEMP/rc10-native"
          printf '29ce535b56e207a406ffa1c2d4842dcc410be003eff8ec508bb732abc9f8e385  %s\n' \
            "$RUNNER_TEMP/rc10-native/xray.zip" | sha256sum -c -
          printf '3f650abf1fc4a4fbf5abe7fc9990a2658020907cd984214e9c075b4b00989fea  %s\n' \
            "$RUNNER_TEMP/rc10-native/xray" | sha256sum -c -
          chmod 755 "$RUNNER_TEMP/rc10-native/xray"
          echo "XRAY_NATIVE_BINARY=$RUNNER_TEMP/rc10-native/xray" >> "$GITHUB_ENV"
      - name: Actual IPv4 TCP/UDP TPROXY packet path, CAP_NET_RAW-only Xray and dead-child fail closed
        shell: bash
        timeout-minutes: 5
        run: |
          set -euo pipefail
          export GITHUB_ACTIONS=true
          echo "RC10_NATIVE: verified exact PID wrapper and CAP_NET_RAW-only TPROXY script"
          bash xray/lab/rc10_native_tproxy_minimal_caps.sh --native-run \
            > "$RUNNER_TEMP/rc10-native-netns.log" 2>&1 || {
              tail -n 160 "$RUNNER_TEMP/rc10-native-netns.log"; exit 1;
            }
          grep -q 'RC10_TPROXY: REAL_XRAY_UID65534_ONLY_CAP_NET_RAW_STARTTICKS_VERIFIED' "$RUNNER_TEMP/rc10-native-netns.log"
          grep -q 'RC10_TPROXY: REAL_TCP_UDP_PACKET_INTERCEPTION_WITH_CAP_NET_RAW_AND_DEAD_CHILD_BLOCKED_PASS' "$RUNNER_TEMP/rc10-native-netns.log"
          grep -q 'KERNEL_TPROXY: PASS disposable namespaces, no production kernel change' "$RUNNER_TEMP/rc10-native-netns.log"
          echo "RC10_NATIVE: PASS real TCP+UDP isolated packet flow, Xray exact 0x2000 caps, dead Xray no leak"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v30-rc10-native-netns-tproxy-raw-only-logs-NO-DEPLOY
          path: |
            ${{ runner.temp }}/rc10-native-netns.log
          if-no-files-found: warn
          retention-days: 14
  rc10-archived-linux49-full-system:
    runs-on: ubuntu-latest
    timeout-minutes: 19
    steps:
      - uses: actions/checkout@v4
      - name: Prepare disposable QEMU and archived Linux 4.9 package extraction tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            qemu-system-x86 busybox-static gcc libc6-dev e2fsprogs cpio gzip zstd \
            kmod curl unzip xz-utils
      - name: Resolve and verify exact archived Debian Linux 4.9 kernel from its SHA256 package index
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v30-rc10-kernel-49"
          cd "$RUNNER_TEMP/v30-rc10-kernel-49"
          # The current Stretch Packages.gz index no longer includes the
          # archived 2020 4.9.0-13 binary even though the .deb remains.
          # Discover its exact SHA in a disposable runner, then pin it in
          # source control. Until pinned, stop BEFORE executing the kernel.
          TARGET="pool/main/l/linux/linux-image-4.9.0-13-amd64_4.9.228-1_amd64.deb"
          curl -fL --retry 3 --max-time 120 -o kernel49.deb \
            "https://archive.debian.org/debian/$TARGET"
          PACKAGE_SHA="$(sha256sum kernel49.deb | awk '{print $1}')"
          printf 'RC10_KERNEL49_PACKAGE_SHA_DISCOVERED=%s\n' "$PACKAGE_SHA"
          PINNED_SHA="d410dd577fac677bb50978d5fe91b622d1520b783cb4ef23a1bcd7851606e326"
          if [ "$PINNED_SHA" != "$PACKAGE_SHA" ]; then
            echo "RC10: source kernel SHA is not yet pinned; HARD_NO_GO before extracting/booting"
            exit 78
          fi
          dpkg-deb -x kernel49.deb kernel-root
          KVER=4.9.0-13-amd64
          test -s "kernel-root/boot/vmlinuz-$KVER"
          test -d "kernel-root/lib/modules/$KVER"
          depmod -b "$(pwd)/kernel-root" "$KVER"
          sha256sum "kernel-root/boot/vmlinuz-$KVER" | tee kernel-image.sha256
          printf 'RC10: ACTUAL_ARCHIVED_49_PACKAGE_SHA256_VERIFIED=%s\n' "$PACKAGE_SHA"
          echo "RC10_KERNEL_IMAGE=$(pwd)/kernel-root/boot/vmlinuz-$KVER" >> "$GITHUB_ENV"
          echo "RC10_KERNEL_VERSION=$KVER" >> "$GITHUB_ENV"
          echo "RC10_MODULE_ROOT=$(pwd)/kernel-root" >> "$GITHUB_ENV"
      - name: Pin official Xray 26.2.6 binary and archive SHA256 before QEMU guest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v30-rc10-xray"
          curl -fL --retry 3 --max-time 120 \
            -o "$RUNNER_TEMP/v30-rc10-xray/xray.zip" \
            https://github.com/XTLS/Xray-core/releases/download/v26.2.6/Xray-linux-64.zip
          unzip -j "$RUNNER_TEMP/v30-rc10-xray/xray.zip" xray -d "$RUNNER_TEMP/v30-rc10-xray"
          printf '29ce535b56e207a406ffa1c2d4842dcc410be003eff8ec508bb732abc9f8e385  %s\n' \
            "$RUNNER_TEMP/v30-rc10-xray/xray.zip" | sha256sum --check --status
          printf '3f650abf1fc4a4fbf5abe7fc9990a2658020907cd984214e9c075b4b00989fea  %s\n' \
            "$RUNNER_TEMP/v30-rc10-xray/xray" | sha256sum --check --status
          chmod 755 "$RUNNER_TEMP/v30-rc10-xray/xray"
          echo "XRAY_NATIVE_BINARY=$RUNNER_TEMP/v30-rc10-xray/xray" >> "$GITHUB_ENV"
          echo "RC10: official Xray sha256 exact binary verified"
      - name: Boot real Linux 4.9 QEMU full system with Xray caps parent death and virtual rescue failure
        shell: bash
        timeout-minutes: 10
        run: |
          set -euo pipefail
          for scenario in baseline rescue-missing rescue-absent; do
            echo "RC10: BEGIN Linux4.9 QEMU $scenario"
            RC10_SCENARIO="$scenario" bash xray/lab/rc10_fullvm_runner.sh |
              tee "$RUNNER_TEMP/rc10-$scenario.log"
            grep -q 'RC10: HARD_NO_GO_PHYSICAL_KEENETIC_RUNTIME_CGROUP_BOOT_USB_TPROXY' "$RUNNER_TEMP/rc10-$scenario.log"
            if [ "$scenario" = baseline ]; then
              grep -q 'RC10: PASS_REAL_LINUX49_XRAY_CAP_RAW_AND_5_OF_5_RESTORE' "$RUNNER_TEMP/rc10-$scenario.log"
            else
              grep -q "RC10: PASS_LINUX49_MISSING_RESCUE_ZERO_WRITES $scenario" "$RUNNER_TEMP/rc10-$scenario.log"
            fi
          done
      - name: Save real Linux 4.9 guest serial logs with physical no-go
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v30-rc10-linux49-qemu-fullsystem-no-production
          path: |
            ${{ runner.temp }}/v30-rc10-kernel-49/kernel-image.sha256
            ${{ runner.temp }}/xray-v30-rc10-fullvm-*/first-boot.log
            ${{ runner.temp }}/xray-v30-rc10-fullvm-*/second-boot.log
            ${{ runner.temp }}/xray-v30-rc10-fullvm-*/first-qemu-errors.log
            ${{ runner.temp }}/xray-v30-rc10-fullvm-*/second-qemu-errors.log
            ${{ runner.temp }}/rc10-*.log
          if-no-files-found: warn
          retention-days: 14
