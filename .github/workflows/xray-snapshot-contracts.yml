name: Xray snapshot offline source contracts

on:
  push:
    branches:
      - snapshot/keenetic-production-2026-10-30
      - feature/xray-v30-stable-tcp-ingress-lab-20261031
    paths:
      - 'xray/production/opt/**'
      - 'xray/staging/**'
      - 'xray/lab/v30_first_migration_transaction.py'
      - 'xray/lab/v30_autonomous_guard_rehearsal.py'
      - 'xray/lab/v30_partial_upgrade_recovery.py'
      - 'xray/lab/v30_release_manifest_contract.py'
      - 'xray/lab/v30_reboot_usb_fault_matrix.py'
      - 'xray/lab/v30_legacy_descendant_migration_gate.py'
      - 'xray/lab/v30_two_phase_migration_contract.py'
      - 'xray/lab/v30_nonusb_rescue_lab.py'
      - 'xray/lab/v30_outofusb_mount_gate.py'
      - 'xray/lab/v30_archived_kernel_pidfd_gate.py'
      - 'xray/lab/v30_parent_owned_kernel49.py'
      - 'xray/lab/v30_parent_owned_mips_recovery.py'
      - 'tests/**'
      - 'tools/**'
      - 'xray/production/MANIFEST.sha256'
      - '.github/workflows/xray-snapshot-contracts.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile frozen Python sources without importing or executing them
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          files = sorted(Path('xray/production/opt/bin').glob('*.py'))
          for path in files:
              ast.parse(path.read_text(encoding='utf-8'), filename=str(path))
          print('PASS: parsed', len(files), 'Python source files')
          PY
      - name: Fail closed on old watchdog S97 S98 descendants and unverified migration status
        shell: bash
        run: |
          set -euo pipefail
          python -m xray.lab.v30_legacy_descendant_migration_gate > "$RUNNER_TEMP/v30-legacy-migration-gate.json"
          python - <<'PY'
          import os,json
          from pathlib import Path
          obj=json.loads((Path(os.environ["RUNNER_TEMP"])/"v30-legacy-migration-gate.json").read_text())
          assert obj["decision"] == "NO_PRODUCTION_CUTOVER"
          assert obj["production_cutover_authorized"] is False
          assert obj["router_commands"] == []
          assert "MISSING_PIDFD_KERNEL_SUPPORTED" in obj["reason_codes"]
          assert "MISSING_LEGACY_CHILD_TREE_DRAINED" in obj["reason_codes"]
          print("PASS: legacy descendants and unknown pidfd strictly BLOCK production")
          PY

      - name: Confirm historical Keenetic 4.9 cannot run pidfd supervisor (no new router jobs)
        shell: bash
        run: |
          set -euo pipefail
          python -m xray.lab.v30_archived_kernel_pidfd_gate --archived-only > "$RUNNER_TEMP/v30-pidfd-archived.json"
          python - <<'PY'
          import os,json
          from pathlib import Path
          r=json.loads((Path(os.environ["RUNNER_TEMP"])/"v30-pidfd-archived.json").read_text())
          assert r["kernel"]=="4.9-ndm-5"
          assert r["archived_job_id"]=="ea140581-a4db-42f5-ac4d-46c8c6c462ba"
          assert r["release_gate"]=="OFFLINE_KERNEL_INCOMPATIBLE"
          assert r["pidfd_open_kernel_capable"] is False
          assert r["pidfd_send_signal_kernel_capable"] is False
          assert r["production_commands"]==[]
          print("PASS: historical Keenetic Linux 4.9 lacks pidfd syscalls; no live signal authorization")
          PY

      - name: Deny unverified rescue mount and boot path (offline evidence only)
        shell: bash
        run: |
          set -euo pipefail
          python -m xray.lab.v30_outofusb_mount_gate > "$RUNNER_TEMP/v30-rescue-physical-gate.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          result=json.loads((Path(os.environ["RUNNER_TEMP"])/"v30-rescue-physical-gate.json").read_text())
          assert result["status"]=="INSUFFICIENT_EVIDENCE"
          assert result["production_rescue_authorized"] is False
          assert result["physical_router_reboot_proven"] is False
          assert "MOUNTINFO_UNTRUSTWORTHY" in result["reasons"]
          print("PASS: no fabricated persistent rescue hardware proof")
          PY

      - name: Validate review-only two-phase legacy watchdog S97 S98 S99 cron migration
        shell: bash
        run: |
          set -euo pipefail
          python -m xray.lab.v30_two_phase_migration_contract --offline-plan > "$RUNNER_TEMP/v30-two-phase.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          d=json.loads((Path(os.environ["RUNNER_TEMP"])/"v30-two-phase.json").read_text())
          assert d["decision"] == "REVIEW_ONLY_NO_PRODUCTION_CHANGE"
          assert d["deployment_authorized"] is False
          assert d["trial_authorized"] is False
          assert d["production_commands"] == []
          assert len(d["stages"]) == 8
          assert len(d["legacy_spawner_surfaces"]) == 7
          assert "NO_FRESH_LIVE_PROCESS_SNAPSHOT" in d["reasons"]
          print("PASS: two-phase migration explicit cron/root/descendant gates deny live deployment")
          PY

      - name: Replay actual five-file partial upgrade after lost USB using simulated independent rescue
        shell: bash
        timeout-minutes: 2
        run: |
          set -euo pipefail
          python -m xray.lab.v30_nonusb_rescue_lab --demo "$RUNNER_TEMP/v30-nonusb-rescue" |
            tee "$RUNNER_TEMP/v30-nonusb-rescue.log"
          grep -q 'OFFUSB_RESCUE: PASS corrupt independent rescue rejects before active writes' "$RUNNER_TEMP/v30-nonusb-rescue.log"
          grep -q 'OFFUSB_RESCUE: PASS missing USB backup not used during independent restore' "$RUNNER_TEMP/v30-nonusb-rescue.log"
          grep -q 'OFFUSB_RESCUE: LIMITATION two paths on disposable runner' "$RUNNER_TEMP/v30-nonusb-rescue.log"

      - name: Verify versioned nine-file SHA256 Git blob and frozen mode release manifest
        shell: bash
        run: |
          set -euo pipefail
          python -m xray.lab.v30_release_manifest_contract --verify > "$RUNNER_TEMP/v30-release-integrity.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          result=json.loads((Path(os.environ["RUNNER_TEMP"])/"v30-release-integrity.json").read_text())
          assert result["verified"] == 9
          assert result["status"] == "PASS_STAGED_INTEGRITY_ONLY"
          assert result["production_trial_allowed"] is False
          assert result["deployment_allowed"] is False
          assert len(result["unresolved_gates"]) == 8
          print("PASS: 9 exact staged SHA256/git blobs and 5 frozen original SHA/modes; NOT deploy authorization")
          PY

      - name: Pin exact first-cutover canary SHA256 (never execute live trial)
        shell: bash
        run: |
          set -euo pipefail
          echo '8e57ef5054f53174a35d906d34eab073dd6d787607cb02f29d83364ae3abc203  xray/staging/v30_first_cutover_canary.py' | sha256sum -c -
          sha256sum xray/staging/v30_first_cutover_canary.py
          echo 'PASS: pinned canary content exact; no router or network operations'

      - name: Compile proposed first-cutover canary without executing it
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile xray/staging/v30_first_cutover_canary.py
          python xray/staging/v30_first_cutover_canary.py --help > /dev/null
          echo "PASS: candidate CLI imports/compiles; production --trial and --rollback NOT executed"

      - name: Verify frozen production snapshot SHA256 and Git modes (offline only)
        shell: bash
        run: |
          set -euo pipefail
          python tools/verify_production_snapshot.py --output "$RUNNER_TEMP/snapshot-integrity.json"
          python - <<'PY'
          from pathlib import Path
          import json
          import os
          report = json.loads((Path(os.environ["RUNNER_TEMP"]) / "snapshot-integrity.json").read_text())
          assert report["status"] == "PASS_FROZEN_GITHUB_SNAPSHOT"
          assert report["verified_files"] == 63
          assert report["router_live_hashes_checked"] is False
          assert report["full_router_recovery_verified"] is False
          print("PASS: 63 archived files exactly match manifest; NOT a live router comparison")
          PY
      - name: High-confidence secret check of frozen source files (not history)
        run: python tools/check_snapshot_secrets.py
      - name: Parse active production shell and init scripts without executing
        shell: bash
        run: |
          set -euo pipefail
          for p in \
            xray/production/opt/bin/xray-safe-hourly.sh \
            xray/production/opt/bin/xray-watchdog.sh \
            xray/production/opt/bin/xray-ks-home.sh \
            xray/production/opt/bin/xray-wifi-rules.sh \
            xray/production/opt/etc/init.d/S97xray \
            xray/production/opt/etc/init.d/S98xray-wifi \
            xray/production/opt/etc/init.d/S99xray-watchdog; do
            sh -n "$p"
          done
          echo "PASS: shell syntax check only; scripts NOT executed"
      - name: Assert legacy supervisor S97/S98 live-cutover remains blocked (offline only)
        shell: bash
        run: |
          set -euo pipefail
          python -m xray.lab.v30_supervisor_fencing_contract > "$RUNNER_TEMP/v30-supervisor-fencing-gate.json"
          python - <<'PY'
          from pathlib import Path
          import json, os
          status = json.loads((Path(os.environ["RUNNER_TEMP"]) / "v30-supervisor-fencing-gate.json").read_text())
          assert status["decision"] == "NO_PRODUCTION_TRIAL"
          assert status["authorization"] is False
          assert status["production_commands"] == []
          expected = ("S97_GLOBAL_KILLALL", "WATCHDOG_NO_COOPERATIVE_MUTEX",
                      "S98_RULES_MUTATE_WITHOUT_SHARED_MUTEX", "WIFI_TPROXY_CHAIN_FLUSH")
          for item in expected:
              assert item in status["reasons"], item
          print("PASS: frozen legacy supervisor release gate BLOCKS trial; no router actions")
          PY

      - name: Real disposable two-process TCP/UDP cutover and independent guardian crash recovery
        shell: bash
        timeout-minutes: 2
        run: |
          set -euo pipefail
          python -m xray.lab.v30_fenced_process_recovery_lab --demo "$RUNNER_TEMP/v30-real-process-recovery" |
            tee "$RUNNER_TEMP/v30-real-process-recovery.log"
          grep -q 'PASS: old real TCP and UDP -> candidate real TCP and UDP' "$RUNNER_TEMP/v30-real-process-recovery.log"
          grep -q 'PASS: independent detached guardian acquired lock and restored old TCP+UDP' "$RUNNER_TEMP/v30-real-process-recovery.log"
          grep -q 'LIMITATION: fake endpoints, not Xray' "$RUNNER_TEMP/v30-real-process-recovery.log"
          python -m xray.lab.v30_fenced_process_recovery_lab --demo "$RUNNER_TEMP/v30-prepared-journal-crash" --kill-at prepared |
            tee "$RUNNER_TEMP/v30-prepared-journal-crash.log"
          grep -q 'PASS: guarded recovery from candidate_prepared journal boundary' "$RUNNER_TEMP/v30-prepared-journal-crash.log"
          grep -q 'PASS: independent detached guardian acquired lock and restored old TCP+UDP' "$RUNNER_TEMP/v30-prepared-journal-crash.log"

      - name: Restore partial five-file supervisor upgrade after killed installer (disposable only)
        shell: bash
        timeout-minutes: 2
        run: |
          set -euo pipefail
          python -m xray.lab.v30_partial_upgrade_recovery --demo "$RUNNER_TEMP/v30-upgrade-crash" |
            tee "$RUNNER_TEMP/v30-upgrade-crash.log"
          grep -q 'PARTIAL_UPGRADE: PASS killed updater after 2/5 staged files replaced' "$RUNNER_TEMP/v30-upgrade-crash.log"
          grep -q 'PARTIAL_UPGRADE: PASS independent interpreter recovered 5/5 original SHA256/modes' "$RUNNER_TEMP/v30-upgrade-crash.log"
          python -m xray.lab.v30_partial_upgrade_recovery --demo "$RUNNER_TEMP/v30-frozen-real-upgrade-crash" --frozen-staging |
            tee "$RUNNER_TEMP/v30-frozen-real-upgrade-crash.log"
          grep -q 'PARTIAL_UPGRADE: PASS real frozen legacy and staged replacement bytes 5/5' "$RUNNER_TEMP/v30-frozen-real-upgrade-crash.log"
          python -m xray.staging.v30_cooperative_canary --offline-plan > "$RUNNER_TEMP/v30-cooperative-canary.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          data = json.loads((Path(os.environ["RUNNER_TEMP"]) / "v30-cooperative-canary.json").read_text())
          assert data["common_lock"] == "/opt/var/run/xray-v30-supervisor.lock"
          assert data["production_trial_allowed"] is False
          assert data["legacy_supervisors_replaced"] is False
          assert len(data["template_sha256"]) == 5
          print("PASS: cooperative canary and S97/S98/S99 staging share lock; live trial remains forbidden")
          PY

      - name: Fail-closed lost-USB-backup and simulated boot restart replay of 5 archived services
        shell: bash
        timeout-minutes: 2
        run: |
          set -euo pipefail
          python -m xray.lab.v30_reboot_usb_fault_matrix --demo "$RUNNER_TEMP/v30-reboot-usb-matrix" |
            tee "$RUNNER_TEMP/v30-reboot-usb-matrix.log"
          grep -q 'USB_FAULT: PASS missing backup blocks before any additional active script writes' "$RUNNER_TEMP/v30-reboot-usb-matrix.log"
          grep -q 'USB_FAULT: PASS corrupted backup SHA blocks writes despite returned USB' "$RUNNER_TEMP/v30-reboot-usb-matrix.log"
          grep -q 'REBOOT_REPLAY: PASS restored 5/5 archived S97/S98/S99/watchdog/rules SHA256' "$RUNNER_TEMP/v30-reboot-usb-matrix.log"

      - name: Run non-mutating source and snapshot mutation tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Execute synthetic first-migration dry-run and assert NO DEPLOY
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          data = {
              "config_sha256": "a"*64, "xray_binary_sha256": "b"*64,
              "pid": 1234, "start_ticks": 123456,
              "socks_listener": "127.0.0.1:10808",
              "tproxy_listener": "0.0.0.0:12345",
              "watchdog_mode": "legacy-killall",
              "kill_switch": True, "tproxy_chain": True,
              "route_table_100": True, "candidate_test": True,
              "candidate_api": True, "rollback_artifact": True,
              "outbound_direct_count": 0, "outbound_block_count": 1,
              "subscription_staging_only": True,
              "ingress_handoff_proven": False,
          }
          Path("/tmp/xray-v30-synthetic-inventory.json").write_text(json.dumps(data))
          PY
          rc=0
          python xray/lab/first_migration_dry_run_v30.py \
            --inventory /tmp/xray-v30-synthetic-inventory.json \
            --output /tmp/xray-v30-dry-run-result.json || rc=$?
          test "$rc" -eq 2
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path("/tmp/xray-v30-dry-run-result.json").read_text())
          assert result["decision"] == "NOT_AUTHORIZED"
          assert result["production_commands"] == []
          assert result["required_manual_approval"] is True
          print("PASS: synthetic first-migration dry-run blocks unproven ingress handoff")
          PY

      - name: Execute isolated cutover simulator with synthetic PID and journal
        shell: bash
        run: |
          set -euo pipefail
          python xray/lab/cutover_controller_v30.py | tee /tmp/xray-v30-cutover-simulation.log
          grep -q 'SWITCHED_SIMULATION_ONLY' /tmp/xray-v30-cutover-simulation.log
          grep -q 'handoff_proven=True is SYNTHETIC' /tmp/xray-v30-cutover-simulation.log

      - name: Detached rollback guard survives separate CLI invocations (synthetic only)
        shell: bash
        run: |
          set -euo pipefail
          GOOD="$(mktemp -d)"
          BAD="$(mktemp -d)"
          trap 'rm -rf "$GOOD" "$BAD"' EXIT
          python3 -m xray.lab.v30_autonomous_guard_rehearsal --stage "$GOOD" --restore 1
          python3 -m xray.lab.v30_autonomous_guard_rehearsal --stage "$BAD" --restore 0
          python3 -m xray.lab.v30_autonomous_guard_rehearsal --verify "$GOOD" --restore 1
          python3 -m xray.lab.v30_autonomous_guard_rehearsal --verify "$BAD" --restore 0
          python3 -m xray.lab.v30_first_migration_transaction |
            tee "$RUNNER_TEMP/v30-first-cutover-synthetic.log"
          grep -q 'NO APPROVAL OR PRODUCTION CUTOVER' "$RUNNER_TEMP/v30-first-cutover-synthetic.log"
