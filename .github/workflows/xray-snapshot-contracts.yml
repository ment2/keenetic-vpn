name: Xray snapshot offline source contracts

on:
  push:
    branches:
      - snapshot/keenetic-production-2026-10-30
      - feature/xray-v30-stable-tcp-ingress-lab-20261031
    paths:
      - 'xray/production/opt/**'
      - 'xray/staging/**'
      - 'xray/lab/v30_first_migration_transaction.py'
      - 'xray/lab/v30_autonomous_guard_rehearsal.py'
      - 'tests/**'
      - 'tools/**'
      - 'xray/production/MANIFEST.sha256'
      - '.github/workflows/xray-snapshot-contracts.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile frozen Python sources without importing or executing them
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          files = sorted(Path('xray/production/opt/bin').glob('*.py'))
          for path in files:
              ast.parse(path.read_text(encoding='utf-8'), filename=str(path))
          print('PASS: parsed', len(files), 'Python source files')
          PY
      - name: Pin exact first-cutover canary SHA256 (never execute live trial)
        shell: bash
        run: |
          set -euo pipefail
          echo '8e57ef5054f53174a35d906d34eab073dd6d787607cb02f29d83364ae3abc203  xray/staging/v30_first_cutover_canary.py' | sha256sum -c -
          sha256sum xray/staging/v30_first_cutover_canary.py
          echo 'PASS: pinned canary content exact; no router or network operations'

      - name: Compile proposed first-cutover canary without executing it
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile xray/staging/v30_first_cutover_canary.py
          python xray/staging/v30_first_cutover_canary.py --help > /dev/null
          echo "PASS: candidate CLI imports/compiles; production --trial and --rollback NOT executed"

      - name: Verify frozen production snapshot SHA256 and Git modes (offline only)
        shell: bash
        run: |
          set -euo pipefail
          python tools/verify_production_snapshot.py --output "$RUNNER_TEMP/snapshot-integrity.json"
          python - <<'PY'
          from pathlib import Path
          import json
          import os
          report = json.loads((Path(os.environ["RUNNER_TEMP"]) / "snapshot-integrity.json").read_text())
          assert report["status"] == "PASS_FROZEN_GITHUB_SNAPSHOT"
          assert report["verified_files"] == 63
          assert report["router_live_hashes_checked"] is False
          assert report["full_router_recovery_verified"] is False
          print("PASS: 63 archived files exactly match manifest; NOT a live router comparison")
          PY
      - name: High-confidence secret check of frozen source files (not history)
        run: python tools/check_snapshot_secrets.py
      - name: Parse active production shell and init scripts without executing
        shell: bash
        run: |
          set -euo pipefail
          for p in \
            xray/production/opt/bin/xray-safe-hourly.sh \
            xray/production/opt/bin/xray-watchdog.sh \
            xray/production/opt/bin/xray-ks-home.sh \
            xray/production/opt/bin/xray-wifi-rules.sh \
            xray/production/opt/etc/init.d/S97xray \
            xray/production/opt/etc/init.d/S98xray-wifi \
            xray/production/opt/etc/init.d/S99xray-watchdog; do
            sh -n "$p"
          done
          echo "PASS: shell syntax check only; scripts NOT executed"
      - name: Run non-mutating source and snapshot mutation tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Execute synthetic first-migration dry-run and assert NO DEPLOY
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          data = {
              "config_sha256": "a"*64, "xray_binary_sha256": "b"*64,
              "pid": 1234, "start_ticks": 123456,
              "socks_listener": "127.0.0.1:10808",
              "tproxy_listener": "0.0.0.0:12345",
              "watchdog_mode": "legacy-killall",
              "kill_switch": True, "tproxy_chain": True,
              "route_table_100": True, "candidate_test": True,
              "candidate_api": True, "rollback_artifact": True,
              "outbound_direct_count": 0, "outbound_block_count": 1,
              "subscription_staging_only": True,
              "ingress_handoff_proven": False,
          }
          Path("/tmp/xray-v30-synthetic-inventory.json").write_text(json.dumps(data))
          PY
          rc=0
          python xray/lab/first_migration_dry_run_v30.py \
            --inventory /tmp/xray-v30-synthetic-inventory.json \
            --output /tmp/xray-v30-dry-run-result.json || rc=$?
          test "$rc" -eq 2
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path("/tmp/xray-v30-dry-run-result.json").read_text())
          assert result["decision"] == "NOT_AUTHORIZED"
          assert result["production_commands"] == []
          assert result["required_manual_approval"] is True
          print("PASS: synthetic first-migration dry-run blocks unproven ingress handoff")
          PY

      - name: Execute isolated cutover simulator with synthetic PID and journal
        shell: bash
        run: |
          set -euo pipefail
          python xray/lab/cutover_controller_v30.py | tee /tmp/xray-v30-cutover-simulation.log
          grep -q 'SWITCHED_SIMULATION_ONLY' /tmp/xray-v30-cutover-simulation.log
          grep -q 'handoff_proven=True is SYNTHETIC' /tmp/xray-v30-cutover-simulation.log

      - name: Detached rollback guard survives separate CLI invocations (synthetic only)
        shell: bash
        run: |
          set -euo pipefail
          GOOD="$(mktemp -d)"
          BAD="$(mktemp -d)"
          trap 'rm -rf "$GOOD" "$BAD"' EXIT
          python3 -m xray.lab.v30_autonomous_guard_rehearsal --stage "$GOOD" --restore 1
          python3 -m xray.lab.v30_autonomous_guard_rehearsal --stage "$BAD" --restore 0
          python3 -m xray.lab.v30_autonomous_guard_rehearsal --verify "$GOOD" --restore 1
          python3 -m xray.lab.v30_autonomous_guard_rehearsal --verify "$BAD" --restore 0
          python3 -m xray.lab.v30_first_migration_transaction |
            tee "$RUNNER_TEMP/v30-first-cutover-synthetic.log"
          grep -q 'NO APPROVAL OR PRODUCTION CUTOVER' "$RUNNER_TEMP/v30-first-cutover-synthetic.log"
