name: Xray v30 RC8 full-system unprivileged descendants and fail-closed corrupt reboot

on:
  push:
    branches:
      - feature/xray-v30-stable-tcp-ingress-lab-20261031
    paths:
      - '.github/workflows/xray-v30-rc8-fullsystem.yml'
      - 'xray/lab/rc8_*'
      - 'xray/lab/rc7_fullvm_cgroup_probe.c'
      - 'xray/lab/rc7_guest_fdatasync.c'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rc8-full-system:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Install disposable full QEMU kernel, BusyBox, and ext4 tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            qemu-system-x86 linux-image-virtual busybox-static \
            gcc libc6-dev e2fsprogs cpio gzip zstd kmod
      - name: Real QEMU full-system guest baseline plus fail-closed journal and rescue corruptions
        shell: bash
        timeout-minutes: 12
        run: |
          set -euo pipefail
          for scenario in baseline journal-corrupt rescue-corrupt; do
            echo "RC8: BEGIN scenario=$scenario"
            RC8_SCENARIO="$scenario" bash xray/lab/rc8_fullvm_runner.sh |
              tee "$RUNNER_TEMP/rc8-$scenario.log"
            grep -q 'RC8: HARD_NO_GO_PHYSICAL_KEENETIC_RUNTIME_CGROUP_BOOT_USB_TPROXY' "$RUNNER_TEMP/rc8-$scenario.log"
            if [ "$scenario" = baseline ]; then
              grep -q 'RC8: PASS_DISPOSABLE_QEMU_TWO_BOOT_POWERLOSS_RESCUE_5_OF_5' "$RUNNER_TEMP/rc8-$scenario.log"
            else
              grep -q 'RC8: PASS_FAIL_CLOSED_CORRUPT_IMAGE_ZERO_ACTIVE_WRITES' "$RUNNER_TEMP/rc8-$scenario.log"
              grep -q 'RC8: PASS_GUEST_REBOOT_CORRUPTION_HARD_NO_GO_' "$RUNNER_TEMP/rc8-$scenario.log"
            fi
          done
          echo "RC8: ALL_THREE_FULL_SYSTEM_SCENARIOS_COMPLETE_WITH_PHYSICAL_NO_GO"
      - name: Upload full serial logs and evidence, no deploy
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v30-rc8-fullsystem-privdrop-journal-rescue-NO-DEPLOY
          path: |
            ${{ runner.temp }}/xray-v30-rc8-fullvm-*/first-boot.log
            ${{ runner.temp }}/xray-v30-rc8-fullvm-*/second-boot.log
            ${{ runner.temp }}/xray-v30-rc8-fullvm-*/cgroup-disposition.txt
            ${{ runner.temp }}/xray-v30-rc8-fullvm-*/first-qemu-errors.log
            ${{ runner.temp }}/xray-v30-rc8-fullvm-*/second-qemu-errors.log
            ${{ runner.temp }}/rc8-*.log
          if-no-files-found: warn
          retention-days: 14
