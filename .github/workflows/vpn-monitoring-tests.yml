name: VPN monitoring isolated tests
on:
  push:
    branches: [feature/vpn-monitoring-home-assistant-20261104]
    paths:
      - 'monitoring/**'
      - '.github/workflows/vpn-monitoring-tests.yml'
  workflow_dispatch:
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s monitoring/tests -p 'test_*.py' -v
