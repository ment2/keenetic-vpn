name: VPN monitoring isolated tests
on:
  push:
    branches: [feature/vpn-monitoring-home-assistant-20261104]
    paths:
      - 'monitoring/**/*.py'
      - 'xray/candidates/geo-independent-v23/**'
      - 'monitoring/homeassistant/*.yaml'
      - '.github/workflows/vpn-monitoring-tests.yml'
  workflow_dispatch:

# Keep only the newest offline test run per feature branch, rather than
# accumulating a separate ubuntu-latest job for every rapid source commit.
concurrency:
  group: vpn-monitoring-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install Jinja2==3.1.6 PyYAML==6.0.2
      - run: python -m unittest discover -s monitoring/tests -p 'test_*.py' -v
