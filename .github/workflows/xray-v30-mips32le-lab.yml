name: Xray v30 isolated MIPS32LE compatibility

on:
  push:
    branches:
      - snapshot/keenetic-production-2026-10-30
      - feature/xray-v30-stable-tcp-ingress-lab-20261031
    paths:
      - '.github/workflows/xray-v30-mips32le-lab.yml'
      - 'xray/lab/xray_v30_api_continuity.py'
      - 'xray/lab/xray_v30_dual_process.py'
      - 'xray/lab/stable_socks_ingress_v30.py'
      - 'xray/lab/xray_v30_stable_ingress_demo.py'
      - 'xray/lab/xray_v30_pool_handover_api.py'
      - 'xray/lab/xray_v30_dokodemo_lab.py'
      - 'xray/lab/v30_mips_guardian_failover.py'
      - 'xray/lab/v30_parent_owned_kernel49.py'
      - 'xray/lab/v30_parent_owned_mips_recovery.py'
      - 'xray/staging/v30_kernel49_cooperative_ledger.py'
      - 'xray/lab/v30_kernel49_cooperative_lab.py'
      - 'xray/lab/v30_mips_guardian_cas_recovery.py'
      - 'xray/lab/v30_kernel49_cgroup_v1_contract.py'
      - 'xray/staging/v30_supervisor_core.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mips32le:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install QEMU user emulator on disposable runner
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qemu-user
      - name: Download official pinned Xray 26.2.6 mips32le
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/xray-mipsle"
          curl -fL --retry 3 --max-time 120 \
            -o "$RUNNER_TEMP/xray-mipsle/xray.zip" \
            https://github.com/XTLS/Xray-core/releases/download/v26.2.6/Xray-linux-mips32le.zip
          curl -fL --retry 3 --max-time 30 \
            -o "$RUNNER_TEMP/xray-mipsle/xray.zip.dgst" \
            https://github.com/XTLS/Xray-core/releases/download/v26.2.6/Xray-linux-mips32le.zip.dgst
          cat "$RUNNER_TEMP/xray-mipsle/xray.zip.dgst"
          unzip -j "$RUNNER_TEMP/xray-mipsle/xray.zip" xray -d "$RUNNER_TEMP/xray-mipsle"
          chmod 700 "$RUNNER_TEMP/xray-mipsle/xray"
          file "$RUNNER_TEMP/xray-mipsle/xray"
          qemu-mipsel "$RUNNER_TEMP/xray-mipsle/xray" version
      - name: Execute API continuity lab under MIPS32LE QEMU
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/xray-mipsle/xray-qemu" <<'SH'
          #!/bin/sh
          exec qemu-mipsel "$XRAY_MIPS_BINARY" "$@"
          SH
          chmod 700 "$RUNNER_TEMP/xray-mipsle/xray-qemu"
          export XRAY_MIPS_BINARY="$RUNNER_TEMP/xray-mipsle/xray"
          python3 xray/lab/xray_v30_api_continuity.py \
            --xray "$RUNNER_TEMP/xray-mipsle/xray-qemu" --run

      - name: Execute real dual-process MIPSLE cutover and rollback lab
        shell: bash
        run: |
          export XRAY_MIPS_BINARY="$RUNNER_TEMP/xray-mipsle/xray"
          python3 -m xray.lab.xray_v30_dual_process \
            --xray "$RUNNER_TEMP/xray-mipsle/xray-qemu" --run

      - name: Execute real stable-ingress TCP cutover and rollback under MIPSLE QEMU
        shell: bash
        run: |
          export XRAY_MIPS_BINARY="$RUNNER_TEMP/xray-mipsle/xray"
          python3 -m xray.lab.xray_v30_stable_ingress_demo \
            --xray "$RUNNER_TEMP/xray-mipsle/xray-qemu" --run

      - name: Keep qualified active endpoint when preparing new pool and verify BO rollback
        shell: bash
        run: |
          export XRAY_MIPS_BINARY="$RUNNER_TEMP/xray-mipsle/xray"
          python3 -m xray.lab.xray_v30_pool_handover_api \
            --xray "$RUNNER_TEMP/xray-mipsle/xray-qemu" --run

      - name: Exercise real MIPSLE dokodemo-door TCP and UDP loopback only
        shell: bash
        run: |
          export XRAY_MIPS_BINARY="$RUNNER_TEMP/xray-mipsle/xray"
          python3 -m xray.lab.xray_v30_dokodemo_lab \
            --xray "$RUNNER_TEMP/xray-mipsle/xray-qemu" --run

      - name: Real QEMU MIPSLE dual guardian crash recovery at committed candidate
        shell: bash
        timeout-minutes: 3
        run: |
          set -euo pipefail
          export XRAY_MIPS_BINARY="$RUNNER_TEMP/xray-mipsle/xray"
          python3 -m xray.lab.v30_mips_guardian_failover \
            --xray "$RUNNER_TEMP/xray-mipsle/xray-qemu" \
            --demo "$RUNNER_TEMP/v30-mips-guard-committed" --crash-at running |
            tee "$RUNNER_TEMP/v30-mips-guard-committed.log"
          grep -q 'MIPS_GUARD: PASS primary guardian killed holding common flock' "$RUNNER_TEMP/v30-mips-guard-committed.log"
          grep -q 'MIPS_GUARD: PASS independent secondary restored real MIPS Xray TCP+UDP' "$RUNNER_TEMP/v30-mips-guard-committed.log"

      - name: Real QEMU MIPSLE guardian crash recovery at candidate prepared pre-commit
        shell: bash
        timeout-minutes: 3
        run: |
          set -euo pipefail
          export XRAY_MIPS_BINARY="$RUNNER_TEMP/xray-mipsle/xray"
          python3 -m xray.lab.v30_mips_guardian_failover \
            --xray "$RUNNER_TEMP/xray-mipsle/xray-qemu" \
            --demo "$RUNNER_TEMP/v30-mips-guard-prepared" --crash-at prepared |
            tee "$RUNNER_TEMP/v30-mips-guard-prepared.log"
          grep -q 'MIPS_GUARD: PASS controller crash at prepared' "$RUNNER_TEMP/v30-mips-guard-prepared.log"
          grep -q 'MIPS_GUARD: PASS independent secondary restored real MIPS Xray TCP+UDP' "$RUNNER_TEMP/v30-mips-guard-prepared.log"

      - name: Real QEMU MIPSLE recovery after primary guardian dies mid-rollback
        shell: bash
        timeout-minutes: 3
        run: |
          set -euo pipefail
          export XRAY_MIPS_BINARY="$RUNNER_TEMP/xray-mipsle/xray"
          python3 -m xray.lab.v30_mips_guardian_failover \
            --xray "$RUNNER_TEMP/xray-mipsle/xray-qemu" \
            --demo "$RUNNER_TEMP/v30-mips-guard-mid-rollback" --crash-at running \
            --guardian-crash-at after_candidate_stop |
            tee "$RUNNER_TEMP/v30-mips-guard-mid-rollback.log"
          grep -q 'MIPS_GUARD: PASS primary guardian fault at after_candidate_stop' "$RUNNER_TEMP/v30-mips-guard-mid-rollback.log"
          grep -q 'MIPS_GUARD: PASS independent secondary restored real MIPS Xray TCP+UDP' "$RUNNER_TEMP/v30-mips-guard-mid-rollback.log"

      - name: Real MIPS32LE QEMU boot-like recovery from persistent journal after both guardians die
        shell: bash
        timeout-minutes: 3
        run: |
          set -euo pipefail
          export XRAY_MIPS_BINARY="$RUNNER_TEMP/xray-mipsle/xray"
          python3 -m xray.lab.v30_mips_guardian_failover \
            --xray "$RUNNER_TEMP/xray-mipsle/xray-qemu" \
            --demo "$RUNNER_TEMP/v30-mips-boot-replay" --crash-at running \
            --boot-replay |
            tee "$RUNNER_TEMP/v30-mips-boot-replay.log"
          grep -q 'MIPS_BOOT_REPLAY: PASS killed both original guardians; fresh process recovered persisted MIPS Xray transaction' "$RUNNER_TEMP/v30-mips-boot-replay.log"
          grep -q 'MIPS_GUARD: PASS independent secondary restored real MIPS Xray TCP+UDP' "$RUNNER_TEMP/v30-mips-boot-replay.log"

      - name: Real MIPSLE Xray Linux49 parent-owned process death, child death, crash mid rollback and fsynced preexec
        shell: bash
        timeout-minutes: 5
        run: |
          set -euo pipefail
          export XRAY_MIPS_BINARY="$RUNNER_TEMP/xray-mipsle/xray"
          for scenario in parent_crash child_exit rollback prepared; do
            python3 -m xray.lab.v30_parent_owned_mips_recovery \
              --demo "$RUNNER_TEMP/v30-parent49-$scenario" \
              --xray "$RUNNER_TEMP/xray-mipsle/xray-qemu" \
              --case "$scenario" | tee "$RUNNER_TEMP/v30-parent49-$scenario.log"
            grep -q "PARENT49: PASS real MIPS32LE QEMU Xray SOCKS5 TCP+UDP recovered" "$RUNNER_TEMP/v30-parent49-$scenario.log"
            grep -q "PARENT49: PASS never signaled a stale PID" "$RUNNER_TEMP/v30-parent49-$scenario.log"
            grep -q "PARENT49: PASS failure injection $scenario" "$RUNNER_TEMP/v30-parent49-$scenario.log"
          done

      - name: Real MIPSLE Xray coordinated S97 S98 S99 watchdog cron restarts and two guardian failures
        shell: bash
        timeout-minutes: 4
        run: |
          set -euo pipefail
          export XRAY_MIPS_BINARY="$RUNNER_TEMP/xray-mipsle/xray"
          python3 -m xray.lab.v30_kernel49_cooperative_lab \
            --demo "$RUNNER_TEMP/v30-kernel49-cooperative" \
            --xray "$RUNNER_TEMP/xray-mipsle/xray-qemu" |
            tee "$RUNNER_TEMP/v30-kernel49-cooperative.log"
          grep -q 'COOP49: PASS real MIPSLE TCP/UDP across 3 serialized competing S97 restarts' "$RUNNER_TEMP/v30-kernel49-cooperative.log"
          grep -q 'COOP49: PASS S98 no-rules-mutation, watchdog/cron/S99 shared-flock requests' "$RUNNER_TEMP/v30-kernel49-cooperative.log"
          grep -q 'COOP49: PASS parent and guardian killed; independent owner restored real MIPS TCP/UDP' "$RUNNER_TEMP/v30-kernel49-cooperative.log"
          grep -q 'COOP49: PASS crash mid-RESTART receipt remains UNCERTAIN, not replayed' "$RUNNER_TEMP/v30-kernel49-cooperative.log"

      - name: Real MIPSLE child with two competing cohorts of eight guardian CAS claims
        shell: bash
        timeout-minutes: 4
        run: |
          set -euo pipefail
          export XRAY_MIPS_BINARY="$RUNNER_TEMP/xray-mipsle/xray"
          python3 -m xray.lab.v30_mips_guardian_cas_recovery \
            --demo "$RUNNER_TEMP/v30-mips-guardian-cas-rc5" \
            --xray "$RUNNER_TEMP/xray-mipsle/xray-qemu" |
            tee "$RUNNER_TEMP/v30-mips-guardian-cas-rc5.log"
          grep -q 'MIPS_CAS: PASS competing 8+8 guardians, one CAS claim per generation' "$RUNNER_TEMP/v30-mips-guardian-cas-rc5.log"
          grep -q 'MIPS_CAS: PASS old RESTART UNCERTAIN exactly once' "$RUNNER_TEMP/v30-mips-guardian-cas-rc5.log"
          grep -q 'MIPS_CAS: PASS new parent restored real MIPS32LE Xray SOCKS5 TCP+UDP' "$RUNNER_TEMP/v30-mips-guardian-cas-rc5.log"
