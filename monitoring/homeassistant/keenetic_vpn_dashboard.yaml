      - type: markdown
        title: Ограничения интерпретации
        content: |
          - `vpn06` и `vpn07` ранее давали `network_error` для OpenAI при работавшем общем VLESS HTTP.
          - Статусы отображают результат **изолированной проверки**, не фактический выбор узла балансировщиком.
          - Счётчики интерфейсов `apclii0`, `br0`, `br1` нельзя суммировать и называть трафиком отдельных VLESS-серверов.
          - Не путать подготовленный OpenAI-qualified пул из пяти узлов с реально применённой конфигурацией Xray.
