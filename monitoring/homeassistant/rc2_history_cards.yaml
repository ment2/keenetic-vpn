# RC2 candidate history; only IDs in current snapshot.
- type: custom:auto-entities
  card:
    type: history-graph
    title: VPN · 24 ч
    hours_to_show: 24
  show_empty: false
  filter:
    template: |-
      {% set eid = 'sensor.keenetic_dynamic_vpn_rc2' %}
      {% set rows = state_attr(eid,'rows') or [] %}
      {% set age = as_timestamp(now()) - (state_attr(eid,'checked_at') | int(0)) %}
      {% set ns = namespace(entities=[]) %}
      {% if states(eid) == 'ok' and 0 <= age <= 150 %}
        {% for r in rows %}
          {% for s in states.sensor if s.entity_id.startswith('sensor.keenetic_rc2_') and s.attributes.get('node_id') == r.id and s.attributes.get('metric') == 'vpn' %}
            {% set ns.entities = ns.entities + [{'entity': s.entity_id, 'name': r.tag}] %}
          {% endfor %}
        {% endfor %}
      {% endif %}
      {{ ns.entities | to_json }}
